<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7D8C">
<title>IPB Pipeline</title>
<style>
:root{
  --bg:#E9EFF0; --surface:#FFFFFF; --surface2:#F5F8F8;
  --ink:#0F252D; --ink2:#3D5A63; --muted:#7A939B; --line:#D3DEE0;
  --teal:#0A7D8C; --teal-d:#075965; --teal-l:#E0EFF1;
  --sun:#E8930C; --sun-l:#FDF0DA;
  --ok:#1B8A56; --ok-l:#E1F2E9;
  --alert:#C13D28; --alert-l:#FBE7E3;
  --wa:#1FA855;
  --r:10px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(68px + var(--safe));
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--teal-d);color:#fff;
  padding:12px 16px 11px;display:flex;align-items:center;gap:10px;
}
.top .mark{width:22px;height:22px;flex:none}
.top h1{font-size:16px;flex:1;letter-spacing:-.02em}
.top .who{
  font-size:12px;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:999px;
  font-weight:600;
}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 24px}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe);
}
.nav button{
  position:relative;
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;
  min-width:0;
}
.nav button span:not(.pip){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--teal)}
.nav .pip{
  position:absolute;top:4px;left:50%;margin-left:4px;background:var(--alert);color:#fff;
  font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;
  display:grid;place-items:center;padding:0 4px;
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.pad{padding:13px 14px}
.sec{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 2px 8px}
.sec:first-child{margin-top:2px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.tr{text-align:right}
.tiny{font-size:12.5px;color:var(--ink2)}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:-.02em}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{
  background:var(--teal);color:#fff;font-weight:650;font-size:15px;
  padding:12px 16px;border-radius:9px;display:block;width:100%;text-align:center;
}
.btn.ghost{background:var(--surface);color:var(--teal);border:1.5px solid var(--line)}
.btn.dim{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.btn.wa{background:var(--wa)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto;display:inline-block}
.btn:disabled{opacity:.4}

.tag{
  display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:6px;
  background:var(--surface2);color:var(--ink2);white-space:nowrap
}
.tag.teal{background:var(--teal-l);color:var(--teal-d)}
.tag.sun{background:var(--sun-l);color:#8A5600}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.alert{background:var(--alert-l);color:var(--alert)}

label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:4px}
.in{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--surface);
}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
textarea.in{min-height:76px;resize:vertical;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* ---------- lead rows ---------- */
.lead{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden;width:100%;text-align:left}
.lead .bar{width:5px;flex:none;background:var(--muted)}
.lead .body{padding:11px 12px;flex:1;min-width:0}
.lead .nm{font-weight:650;font-size:15px}
.lead .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.lead .rt{padding:11px 12px 11px 0;text-align:right;flex:none;display:flex;
  flex-direction:column;justify-content:center;gap:4px;align-items:flex-end}

/* ---------- follow-up ---------- */
.fu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:11px;overflow:hidden}
.fu.due{border-color:var(--sun);box-shadow:0 1px 0 var(--sun)}
.fu .hd{padding:12px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.fu .msg{
  margin:0 14px 12px;padding:11px 12px;background:var(--surface2);
  border-left:3px solid var(--sun);border-radius:0 8px 8px 0;
  font-size:14px;line-height:1.5;color:var(--ink2);white-space:pre-wrap;
}
.fu .acts{display:flex;gap:8px;padding:0 14px 13px}
.fu .acts .btn{flex:2;min-width:0}
.fu .acts .btn.dim{flex:1}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .wrap{padding-bottom:calc(34px + var(--safe))}
.sheet .shead{position:sticky;top:0;background:var(--teal-d);color:#fff;padding:11px 14px;
  display:flex;align-items:center;gap:12px;z-index:5}
.sheet .shead h2{font-size:16px;flex:1;min-width:0}
.x{font-size:26px;line-height:1;color:#fff;padding:0 4px;font-weight:300}

.stage{display:flex;flex-wrap:wrap;gap:6px}
.stage button{padding:7px 10px;border-radius:7px;font-size:12.5px;font-weight:600;
  background:var(--surface2);color:var(--ink2);border:1.5px solid transparent}
.stage button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.stage button.won.on{background:var(--ok);border-color:var(--ok)}
.stage button.lost.on{background:var(--alert);border-color:var(--alert)}

.log{border-left:2px solid var(--line);margin-left:5px;padding-left:14px}
.log .e{padding-bottom:13px;position:relative}
.log .e:before{content:'';position:absolute;left:-20px;top:5px;width:9px;height:9px;
  border-radius:99px;background:var(--teal);border:2px solid var(--surface)}
.log .e .w{font-size:11.5px;color:var(--muted)}

.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:1 1 auto;min-width:0}
.kv .v{font-weight:600;text-align:right;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.stat .n{font-size:25px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  line-height:1.1;overflow-wrap:anywhere}
@media(max-width:360px){.stat .n{font-size:21px}}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}

.funnel .f{display:flex;align-items:center;gap:9px;padding:7px 0}
.funnel .lb{width:96px;flex:none;font-size:13px;line-height:1.25}
.funnel .track{flex:1;min-width:40px;height:7px;background:var(--surface2);
  border-radius:99px;overflow:hidden}
.funnel .vv{width:58px;flex:none;text-align:right;font-size:13px}
.funnel .fill{height:100%;background:var(--teal);border-radius:99px}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:9px;font-size:14px;
  font-weight:600;z-index:99;max-width:88vw;text-align:center}

.gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--teal-d)}
.gate .box{background:var(--surface);border-radius:14px;padding:26px 22px;width:100%;max-width:330px}
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty p{margin:6px 0 16px;font-size:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- installer spec sheet ---------- */
.doc{background:#fff;max-width:760px;margin:0 auto;padding:0 0 40px;color:#1a1a1a;
  font-size:13px;line-height:1.5}
.doc .goldbar{height:9px;background:#E8930C}
.doc .dhead{display:flex;gap:16px;align-items:flex-start;padding:22px 26px 16px}
.doc .brand{flex:1}
.doc .brand .nm{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#0A7D8C;line-height:1}
.doc .brand .nm b{color:#1a1a1a}
.doc .brand .sub{font-size:9.5px;letter-spacing:.34em;color:#0A7D8C;font-weight:700;margin-top:3px}
.doc .brand .tagline{font-size:9px;letter-spacing:.14em;color:#6b7b80;margin-top:7px;font-weight:600}
.doc .dref{text-align:right;flex:none}
.doc .dref h3{color:#0A7D8C;font-size:19px;letter-spacing:-.02em}
.doc .dref .r{font-size:11px;font-weight:700;margin-top:2px}
.doc .dref .d{font-size:11px;color:#6b7b80}
.doc .band{background:#E6F2F4;color:#0A7D8C;font-weight:700;font-size:11px;letter-spacing:.06em;
  padding:7px 26px;margin-top:14px}
.doc .dbody{padding:12px 26px 0}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px}
.doc th{background:#0A7D8C;color:#fff;text-align:left;padding:7px 9px;font-size:10.5px;
  letter-spacing:.04em;font-weight:700}
.doc td{padding:7px 9px;border-bottom:1px solid #E4EBEC;vertical-align:top}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .pair{display:flex;gap:18px;font-size:12.5px;padding:3px 0}
.doc .pair .pk{width:168px;flex:none;color:#6b7b80}
.doc .pair .pv{flex:1;font-weight:600}
.doc .callout{border-left:3px solid #E8930C;background:#FDF6EA;padding:10px 13px;margin-top:11px;
  font-size:12px}
.doc .sign{border:1px solid #CBD9DB;border-radius:5px;padding:13px;margin-top:12px}
.doc .line{border-bottom:1px solid #9FB4B8;height:26px;margin-top:13px;position:relative}
.doc .line span{position:absolute;bottom:3px;left:0;font-size:9.5px;color:#6b7b80;
  letter-spacing:.05em;font-weight:600}
.doc .fine{font-size:10px;color:#6b7b80;line-height:1.55;margin-top:16px}
.doc .dfoot{border-top:2px solid #0A7D8C;margin:22px 26px 0;padding-top:9px;
  font-size:9.5px;color:#6b7b80;display:flex;justify-content:space-between;gap:12px}
.printbar{position:sticky;top:0;z-index:5;background:var(--teal-d);padding:10px 14px;
  display:flex;gap:9px;align-items:center}
.printbar .btn{width:auto;padding:9px 14px;font-size:14px}

@media print{
  @page{size:letter;margin:11mm}
  body{background:#fff;padding:0!important}
  .top,.nav,.printbar,.toast{display:none!important}
  .doc{max-width:none;padding:0;font-size:11.5px}
  .doc .dhead{padding:0 0 12px}
  .doc .band{padding-left:0;padding-right:0;margin-top:11px;background:none;
    border-bottom:2px solid #0A7D8C}
  .doc .dbody{padding:9px 0 0}
  .doc .dfoot{margin:16px 0 0}
  .doc .goldbar{height:6px}
  .doc table,.doc .sign{break-inside:avoid}
}
</style>

<body>
<div id="app"></div>

<script>
/* ============================================================
   IPB PIPELINE  v1.0
   Independent Power Bahamas internal CRM and quoting portal.
   Single file. No build step. Runs offline or on Netlify.
   ============================================================ */

/* ---------- 1. STORAGE ----------------------------------------------------
   Tries, in order: Netlify function (live, shared) -> browser storage (local)
   -> memory (demo). Same app file works in all three situations.          */
const Store = (() => {
  let mode = 'memory', mem = null;
  const KEY = 'ipb_pipeline_v1';

  async function tryNet(){
    try{
      const r = await fetch('/.netlify/functions/leads',{cache:'no-store'});
      if(!r.ok) return null;
      const j = await r.json();
      mode='net'; return j;
    }catch(e){ return null; }
  }
  function tryLocal(){
    try{
      const raw = window.localStorage.getItem(KEY);
      mode='local';
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return undefined; }
  }
  return {
    get mode(){return mode},
    async load(){
      const net = await tryNet();
      if(net) return net;
      const loc = tryLocal();
      if(loc !== undefined){ return loc; }
      mode='memory'; return mem;
    },
    async save(data){
      if(mode==='net'){
        try{
          await fetch('/.netlify/functions/leads',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify(data)});
          return;
        }catch(e){ /* fall through to local */ }
      }
      try{ window.localStorage.setItem(KEY, JSON.stringify(data)); mode = mode==='net'?'net':'local'; }
      catch(e){ mem = data; mode='memory'; }
    }
  };
})();

/* ---------- 2. REFERENCE DATA --------------------------------------------
   Package definitions with true cost of goods from the Kevolt price list
   dated 24 Jul 2026. Edit COGS or freight here and every profit figure in
   the app updates. Nothing else needs touching.                            */
const VAT = 0.10;          // Bahamas VAT
const DUTY = 0.00;         // Solar currently 0%. Confirm batteries with your broker.
// Set false if IPB is NOT VAT registered. If false, import VAT cannot be reclaimed,
// so it is added to landed cost and no VAT is stripped out of the selling price.
const VAT_REGISTERED = true;

/* Real hardware, converted to inches from the Kevolt price list. Weights in pounds.
   Clearances are the working allowances used by the space calculator below. */
const HARDWARE = {
  panel:      {name:'620W bifacial glass', w:93.8, h:44.5, d:1.2,  lb:72},
  battery:    {name:'16.08kWh LiFePO4, model DD51314', w:22.6, d:15.2, h:24.0, lb:313, maxStack:3},
  inv10:      {name:'10kW split phase',    w:24.4, h:17.5, d:5.1,  lb:60},
  inv15:      {name:'15kW hybrid, SSE-HL15K', w:20.6, h:32.5, d:10.5, lb:110}
};
const CLEAR = {
  panelGap:2,        // inches between panels
  batterySide:6,     // each side of a battery stack
  batteryFront:30,   // service access in front
  inverterSide:12,   // each side, airflow
  inverterAbove:12   // above and below
};

/* Works out every space figure Snoop needs before he drives out. */
function spaceFor(code){
  const p = PACKAGES[code]; if(!p) return null;
  const B = HARDWARE.battery;
  const inv = HARDWARE[p.invModel];

  // Panel array
  const pw = HARDWARE.panel.w + CLEAR.panelGap, ph = HARDWARE.panel.h + CLEAR.panelGap;
  const arraySqft = Math.round(p.panelQty * pw * ph / 144);

  // Battery bank. Use the fewest stacks allowed, then split evenly between them,
  // so four batteries go 2 and 2 rather than 3 and 1.
  const stacks = Math.ceil(p.batteryQty / B.maxStack);
  const perStack = Math.ceil(p.batteryQty / stacks);
  const bankW = stacks * B.w + (stacks-1) * CLEAR.batterySide;
  const bankH = perStack * B.h;
  const bankFloorSqft = ((bankW + CLEAR.batterySide*2) * (B.d + CLEAR.batteryFront) / 144);

  // Inverter wall run
  const invW = p.invQty * inv.w + (p.invQty-1) * CLEAR.inverterSide;
  const wallW = invW + CLEAR.inverterSide*2;
  const wallH = inv.h + CLEAR.inverterAbove*2;

  const weight = Math.round(p.panelQty*HARDWARE.panel.lb + p.batteryQty*B.lb + p.invQty*inv.lb);

  return {
    arraySqft,
    panelEach: HARDWARE.panel.w.toFixed(1)+' x '+HARDWARE.panel.h.toFixed(1)+' in',
    batteryQty:p.batteryQty, stacks, perStack,
    bankW:Math.round(bankW), bankD:B.d, bankH:Math.round(bankH),
    bankFloorSqft: Math.round(bankFloorSqft*10)/10,
    invName:inv.name, invQty:p.invQty,
    invEach: inv.w.toFixed(1)+' x '+inv.h.toFixed(1)+' x '+inv.d.toFixed(1)+' in',
    wallW:Math.round(wallW), wallH:Math.round(wallH),
    wallSqft: Math.round(wallW*wallH/144*10)/10,
    roomSqft: Math.round((bankFloorSqft + wallW*(inv.d+CLEAR.inverterSide)/144)*10)/10,
    weight
  };
}

const PACKAGES = {
  p1200:{ code:'p1200', name:'PowerUP 1200', price:11599, base:8963.06,  freightCharged:1500, cogs:3465, freight:1600,
    billMin:100, billMax:300, kwh:1200,
    panels:'8 x 620W', inverter:'1 x 10kW', battery:'1 x 16kWh',
    mount:'Roof mount, 8 panels', wire:'100ft PV wire', combiner:'1 x 2-in/2-out',
    panelQty:8, batteryQty:1, invModel:'inv10', invQty:1,
    suits:'2-3 bed, 2-3 mini splits, gas stove and dryer' },
  p2400:{ code:'p2400', name:'PowerUP 2400', price:15599, base:12567.00, freightCharged:1500, cogs:5804, freight:1600,
    billMin:400, billMax:600, kwh:2400,
    panels:'16 x 620W', inverter:'1 x 10kW', battery:'2 x 16kWh',
    mount:'Roof mount, 16 panels', wire:'200ft PV wire', combiner:'1 x 2-in/2-out',
    panelQty:16, batteryQty:2, invModel:'inv10', invQty:1,
    suits:'2-3 bed with electric stove, dryer, dishwasher, water heater' },
  p4400:{ code:'p4400', name:'PowerUP 4400', price:21999, base:18332.43, freightCharged:1500, cogs:8546, freight:1600,
    billMin:800, billMax:1000, kwh:4400,
    panels:'30 x 620W', inverter:'1 x 15kW', battery:'2 x 16kWh',
    mount:'Roof mount, 30 panels', wire:'600ft PV wire', combiner:'1 x 3-in/3-out',
    panelQty:30, batteryQty:2, invModel:'inv15', invQty:1,
    suits:'3-4 bed, 4-5 mini splits, full electric. Third battery often worth quoting.' },
  pmax:{ code:'pmax', name:'PowerUP Max', price:45000, base:39054.05, freightCharged:1500, cogs:17092, freight:1600,
    billMin:1500, billMax:99999, kwh:8800,
    panels:'60 x 620W', inverter:'2 x 15kW', battery:'4 x 16kWh',
    mount:'Ground or roof, 60 panels', wire:'1200ft PV wire', combiner:'2 x 3-in/3-out',
    panelQty:60, batteryQty:4, invModel:'inv15', invQty:2,
    suits:'Small to mid business, 7-10 mini splits. Custom priced, this is a baseline.' }
};
const PKG_LIST = Object.values(PACKAGES);

// Profit, net of VAT both directions. Assumes IPB reclaims input VAT.
/* The quote breakdown, exactly as it appears on an IPB sales contract.
   Rule confirmed against five documents including Helen's signed contract:
     VAT on parts  = 10% of the equipment base
     VAT on landed = 10% of (VAT on parts + freight)
   Install labour, where it appears, is excluded from VAT on parts. */
function quoteOf(code, addons){
  const p = PACKAGES[code]; if(!p) return null;
  const base      = p.base + (Number(addons)||0);
  const vatParts  = Math.round(base * VAT * 100)/100;
  const freight   = p.freightCharged;
  const vatLanded = Math.round((vatParts + freight) * VAT * 100)/100;
  const total     = Math.round((base + vatParts + freight + vatLanded) * 100)/100;
  const deposit   = Math.round(total/2 * 100)/100;
  return {base, vatParts, freight, vatLanded, total,
          deposit, balance: Math.round((total-deposit)*100)/100};
}

function landedOf(code){
  const p = PACKAGES[code]; if(!p) return 0;
  const base = p.cogs * (1+DUTY) + p.freight;
  // Registered: import VAT is reclaimed, so it is not a cost.
  // Not registered: it is a cost and stays in.
  return Math.round(VAT_REGISTERED ? base : base * (1+VAT));
}
/* Registered: IPB remits the VAT it charged, so it keeps base plus freight.
   Not registered: it keeps the whole invoice and the import VAT is a cost. */
function netRevenueOf(code){
  const p = PACKAGES[code]; if(!p) return 0;
  return VAT_REGISTERED ? (p.base + p.freightCharged) : quoteOf(code).total;
}
function profitOf(code){
  if(!PACKAGES[code]) return 0;
  return Math.round(netRevenueOf(code) - landedOf(code));
}
function marginOf(code){
  if(!PACKAGES[code]) return 0;
  return Math.round(profitOf(code) / netRevenueOf(code) * 100);
}

  if(b<=300)  return 'p1200';
  if(b<=600)  return 'p2400';
  if(b<=1000) return 'p4400';
  return 'pmax';
}

/* ---------- 3. FOLLOW-UP SEQUENCE ----------------------------------------
   Days are counted from the day the sequence starts, not from the last send.
   If Noah is away for three weeks he comes back to ONE prompt per lead,
   the most recent one due. Missed steps are skipped, never stacked.        */
const SEQUENCE = [
  {day:1,  label:'24 hours', body:"Hey [NAME], just following up on the solar. Did you get a chance to look at what I sent over?"},
  {day:3,  label:'3 days',   body:"[NAME], checking back in. Any questions come up about the system or how the install side works? Happy to clear anything up."},
  {day:5,  label:'5 days',   body:"Hey [NAME], the summer bills are the ones that hurt the most, and that's what these systems are built to take out. Still worth a conversation?"},
  {day:12, label:'Week 1',   body:"Hey [NAME], is solar still on your mind? Most people I talk to aren't really buying panels. They're putting money into the house instead of handing it to the power company every month for nothing back."},
  {day:19, label:'Week 2',   body:"[NAME], one way to look at it. At what you're paying now, you'll spend the cost of a system on light bills in the next few years anyway. The only question is whether that money goes to the power company or into your own house."},
  {day:26, label:'Week 3',   body:"Hey [NAME], thinking about you with storm season on us. The people who put systems in aren't just cutting the bill, they're the ones with lights on when the rest of the street doesn't. Worth a conversation?"},
  {day:33, label:'Week 4',   body:"[NAME], I'll leave it here for now. If solar comes back around for the house, you know where to find me."}
];
const QUARTERLY = {label:'Quarterly touch', days:90,
  body:"Hey [NAME], checking in. Bills have not got any cheaper. If solar is back on the table for the house let me know and I'll get you a number."};
const BROADCAST = "Hey [NAME], we have a shipment landing in [MONTH] and I'm holding allocation for the people who've been in touch. If solar is still something you want done this year, let me know and I'll put your name against a system before they're spoken for.";

const DAY = 86400000;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const daysSince = ts => Math.floor((Date.now()-ts)/DAY);

/* Returns the single message that is due for this lead right now, or null. */
function dueFollowUp(l){
  const f = l.followUp;
  if(!f || !f.active) return null;
  if(l.salesStage==='won' || l.salesStage==='lost') return null;
  const elapsed = daysSince(f.startedAt);

  if(f.step >= SEQUENCE.length){
    const since = daysSince(f.lastSentAt || f.startedAt);
    if(since >= QUARTERLY.days)
      return {label:QUARTERLY.label, body:fill(QUARTERLY.body,l), step:f.step, quarterly:true,
              overdue:since-QUARTERLY.days};
    return null;
  }
  // Highest step whose due day has passed. Skips missed ones.
  let pick = -1;
  for(let i=f.step;i<SEQUENCE.length;i++){ if(elapsed >= SEQUENCE[i].day) pick = i; }
  if(pick < 0) return null;
  return {label:SEQUENCE[pick].label, body:fill(SEQUENCE[pick].body,l), step:pick,
          overdue: elapsed - SEQUENCE[pick].day, skipped: pick - f.step};
}
function fill(t,l){
  return t.replace(/\[NAME\]/g,(l.name||'').split(' ')[0]||'there')
          .replace(/\[MONTH\]/g, S.data.settings.shipmentMonth||'the coming weeks');
}
function waLink(phone,text){
  const digits = String(phone||'').replace(/\D/g,'');
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(text);
}

function actionList(){

    new Date(l.nextActionDate+'T00:00:00').getTime() <= t &&
    l.salesStage!=='won' && l.salesStage!=='lost')
    .sort((a,b)=>a.nextActionDate.localeCompare(b.nextActionDate));
}
function goingCold(){
  return visibleLeads().filter(l=>{
    if(['won','lost','dormant'].includes(l.salesStage)) return false;
    if(l.followUp.active) return false;
    if(l.nextActionDate) return false;
    const last = l.log[0] ? l.log[0].at : l.createdAt;
    return daysSince(last) >= 7;
  });
}

/* ---------- 6. ACTIONS ---------------------------------------------------- */
function setStage(l,id){
  l.salesStage = id; l.updatedAt = Date.now();
  logTo(l,'stage','Moved to '+stageOf(id).label);
  // Any sign of life kills the sequence. That is the whole point of it.
  if(['responded','call_booked','call_done','won','lost'].includes(id)){
    l.followUp.active = false; l.followUp.step = 0;
  }
  if(['est_sent','contacted'].includes(id) && !l.followUp.active){
    l.followUp = {active:true, step:0, startedAt:Date.now(), lastSentAt:null};
    logTo(l,'note','Follow-up sequence started');
  }
  save(); render();
}
function sendFollowUp(l,fu){
  window.open(waLink(l.phone,fu.body),'_blank');
  l.followUp.step = fu.quarterly ? l.followUp.step : fu.step+1;
  l.followUp.lastSentAt = Date.now();
  logTo(l,'whatsapp','Sent '+fu.label+(fu.skipped>0?' (skipped '+fu.skipped+' earlier steps)':''));
  if(l.salesStage==='new') l.salesStage='contacted';
  save(); toast('Logged. WhatsApp opened.');
}
function theyReplied(l){
  l.followUp.active=false; l.followUp.step=0;
  if(['new','contacted'].includes(l.salesStage)) l.salesStage='responded';
  logTo(l,'note','Customer replied. Sequence stopped.');
  save(); toast('Sequence stopped');
}
function declined(l){
  l.salesStage='lost'; l.followUp.active=false;
  l.lostReason = l.lostReason || 'Declined, asked not to be contacted';
  logTo(l,'stage','Declined. Removed from all sequences.');
  save(); render();
}

}

        <div class="msg">${esc(fu.body)}</div>
        ${fu.skipped>0?`<div class="tiny mut" style="padding:0 14px 9px">

          <button class="btn wa" onclick="doSend('${l.id}',${fu.step},${!!fu.quarterly})">Send on WhatsApp</button>
          <button class="btn dim sm" onclick="doReplied('${l.id}')">They replied</button>
        </div>

    });
  }

  if(cold.length){
    h += `<div class="sec">Going cold, no plan set</div>`;

/* --- MONEY (CEO + Noah) --- */
function viewMoney(){
  const all = S.data.leads;
  const won = all.filter(l=>l.salesStage==='won');
  const open = all.filter(l=>!['won','lost','dormant'].includes(l.salesStage));
  const sum = (arr,f) => arr.reduce((a,l)=>a+(f(l)||0),0);
  const rev = l => PACKAGES[l.package] ? PACKAGES[l.package].price : 0;
  const prof = l => PACKAGES[l.package] ? profitOf(l.package) : 0;

  const wonProfit = sum(won,prof), openProfit = sum(open,prof);
  const step = id => all.filter(l=>reached(l.salesStage,id)).length;

  // A signed deal with no deposit is not money yet. Keep the two apart.
  const paid    = won.filter(l=>['dep50','paid'].includes(l.payStage));
  const unpaid  = won.filter(l=>!['dep50','paid'].includes(l.payStage));
  const cashIn  = paid.reduce((a,l)=>{
    const q = quoteOf(l.package); if(!q) return a;
    return a + (l.payStage==='paid' ? q.total : q.deposit);
  },0);
  const owed = won.reduce((a,l)=>{
    const q = quoteOf(l.package); if(!q) return a;
    if(l.payStage==='paid') return a;
    return a + (l.payStage==='dep50' ? q.balance : q.total);
  },0);

  let h = `<div class="wrap">
  <div class="grid2">
    <div class="stat"><div class="n" style="color:var(--ok)">${money(cashIn)}</div>
      <div class="l">Cash collected, ${paid.length} of ${won.length} signed</div></div>
    <div class="stat"><div class="n" style="color:var(--sun)">${money(owed)}</div>
      <div class="l">Invoiced, still owed</div></div>
    <div class="stat"><div class="n">${money(wonProfit)}</div>
      <div class="l">Profit contracted, ${won.length} deal${won.length===1?'':'s'}</div></div>
    <div class="stat"><div class="n">${money(openProfit)}</div>
      <div class="l">Profit still in the pipeline</div></div>
    <div class="stat"><div class="n">${money(sum(won,rev))}</div><div class="l">Revenue contracted</div></div>
    <div class="stat"><div class="n">${money(sum(open,rev))}</div><div class="l">Revenue open</div></div>
  </div>
  ${unpaid.length?`<div class="card pad" style="border-color:var(--sun);background:var(--sun-l)">
    <strong style="font-size:14px">${unpaid.length} signed deal${unpaid.length===1?'':'s'} with no deposit in</strong>
    <p class="tiny" style="margin:4px 0 0;color:#8A5600">Nothing is ordered and no allocation is held
      until the 50% lands. ${esc(unpaid.map(l=>l.name).join(', '))}.</p></div>`:''}

  <div class="sec">Where leads fall out</div>
  <div class="card pad funnel">`;
  const total = all.length || 1;
  [['new','All leads'],['responded','Replied'],['call_done','Got on a call'],
   ['est_sent','Estimate sent'],['won','Closed won']].forEach(([id,label])=>{
    const n = step(id), pc = Math.round(n/total*100);
    h += `<div class="f"><div class="lb">${label}</div>
      <div class="track"><div class="fill" style="width:${pc}%"></div></div>
      <div class="num vv">${n} &nbsp;${pc}%</div></div>`;
  });
  const estSent = step('est_sent')||1;
  h += `<hr class="sep"><div class="kv"><span class="k">Estimate to close</span>
    <span class="v">${Math.round(won.length/estSent*100)}%</span></div>
    <div class="kv"><span class="k">Lead to close</span>
    <span class="v">${Math.round(won.length/total*100)}%</span></div></div>`;

  h += `<div class="sec">Margin by package</div><div class="card pad">`;
  PKG_LIST.forEach(p=>{
    const cnt = all.filter(l=>l.package===p.code).length, q = quoteOf(p.code);
    h += `<div class="kv"><span class="k">${p.name}<br><span class="tiny mut">
      ${money(q.total)} invoiced &nbsp;&middot;&nbsp; ${money(p.cogs+p.freight)} landed &nbsp;&middot;&nbsp; ${cnt} in pipeline</span></span>
      <span class="v">${money(profitOf(p.code))}<br><span class="tiny mut">${marginOf(p.code)}% margin</span></span></div>`;
  });
  h += `<p class="tiny mut" style="margin:11px 0 0">Profit is net of VAT both ways and assumes
    ${DUTY===0?'0% duty':(DUTY*100)+'% duty'}. Freight is per package. Excludes broker fees,
    local delivery and commission. Change the numbers in the packages block of this file
    and every figure here updates.</p></div>`;

  h += `<div class="sec">Payment status</div><div class="card pad">`;
  PAY_STAGES.forEach(s=>{
    const n = all.filter(l=>l.payStage===s.id && l.salesStage==='won').length;
    if(s.id==='none' && !n) return;
    h += `<div class="kv"><span class="k">${s.label}</span><span class="v">${n}</span></div>`;
  });
  h += `</div>`;

  const flagged = all.filter(l=>l.survey && l.survey.verdict==='flagged');
  if(flagged.length){
    h += `<div class="sec">Site surveys needing a decision</div>`;
    flagged.forEach(l=>h+=leadRow(l,'Flagged'));
  }
  return h+'</div>';
}
function reached(cur,target){
  const order = SALES_STAGES.map(s=>s.id);
  if(cur==='lost'||cur==='dormant') return order.indexOf(target)<=order.indexOf('contacted');
  return order.indexOf(cur) >= order.indexOf(target);
}

      <div class="kv"><span class="k">${fu?'Due now':'Next message'}</span>
        <span class="v">${fu?esc(fu.label):(nextStep?esc(nextStep.label)+', day '+nextStep.day:'Quarterly')}</span></div>`;
    if(fu){
      h += `<div class="msg" style="margin:12px 0 0;border-radius:0 8px 8px 0">${esc(fu.body)}</div>
        <div style="display:flex;gap:8px;margin-top:11px">
        <button class="btn wa" onclick="doSend('${l.id}',${fu.step},${!!fu.quarterly})">Send on WhatsApp</button>
        <button class="btn dim sm" onclick="doReplied('${l.id}')">They replied</button></div>`;
    }
    h += `<button class="btn dim sm" style="margin-top:11px;width:100%"
      onclick="declined(leadById('${l.id}'));render()">They said no, stop everything</button>`;
  } else {
    h += `<div class="kv"><span class="k">Sequence</span><span class="v mut">Not running</span></div>
      <button class="btn ghost" style="margin-top:11px" onclick="startSeq('${l.id}')">Start the sequence</button>`;
  }
  h += `</div>`;

  // next action
  h += `<div class="sec">Your next move</div><div class="card pad">
    <label class="f"><span>What you are doing next</span>
      <input class="in" value="${esc(l.nextAction)}" placeholder="Call about the ground mount"
        onchange="upd('${l.id}','nextAction',this.value)"></label>
    <label class="f" style="margin-bottom:0"><span>When</span>
      <input class="in" type="date" value="${esc(l.nextActionDate)}"
        onchange="upd('${l.id}','nextActionDate',this.value)"></label></div>`;

  // quote packet
  h += `<div class="sec">Quote</div><div class="card pad">`;
  if(l.quote){
    h += `<div class="kv"><span class="k">Number</span><span class="v">${esc(l.quote.number)}</span></div>
      <div class="kv"><span class="k">Total</span><span class="v">${money(l.quote.total)}</span></div>
      <div class="kv"><span class="k">Sent</span><span class="v">${esc(l.quote.date)}</span></div>`;
  }
  h += `<p class="tiny mut" style="margin:${l.quote?'10px':'0'} 0 10px">
      Copy this straight into a message to Zach. It has everything he needs to raise the estimate.</p>
    <button class="btn ghost" onclick="copyPacket('${l.id}')">Copy the quote packet</button>
    <div style="display:flex;gap:9px;margin-top:9px">
      <input class="in" placeholder="Quote number" id="q-num-${l.id}"
        value="${esc(l.quote?l.quote.number:'')}" style="flex:1 1 0;min-width:0">
      <input class="in" placeholder="Total" type="number" inputmode="numeric" id="q-tot-${l.id}"
        value="${l.quote?l.quote.total:''}" style="flex:0 0 104px;min-width:0">
    </div>
    <button class="btn dim sm" style="width:100%;margin-top:9px"
      onclick="saveQuote('${l.id}')">Record the quote</button></div>`;

  // installer assignment + survey
  h += `<div class="sec">Installer spec sheet</div><div class="card pad">
    <p class="tiny mut" style="margin:0 0 11px">A branded one page document with the full system
      spec, the space it needs and the scope of work. Send it to any installer for a quote, or
      give it to the client so they can price it with their own contractor.</p>
    <button class="btn" onclick="openSpec('${l.id}')">Open the spec sheet</button></div>`;

  h += `<div class="sec">What came back from site</div>`;
  if(l.survey) h += surveyReadout(l);
  h += surveyBlock(l);

  // log
  h += `<div class="sec">History</div><div class="card pad">
    <label class="f"><span>Add a note</span>
      <textarea class="in" id="note-${l.id}" placeholder="What happened"></textarea></label>
    <button class="btn dim sm" style="width:100%" onclick="addNote('${l.id}')">Save note</button>
    <hr class="sep"><div class="log">
    ${l.log.map(e=>`<div class="e"><div>${esc(e.body)}</div>
      <div class="w">${esc(e.by)} &middot; ${fmtDate(e.at)}</div></div>`).join('')
      || '<span class="tiny mut">Nothing logged yet.</span>'}
    </div></div>`;

  return h+'</div></div>';
}
window.upd = (id,k,v) => { const l=leadById(id); l[k]=v; l.updatedAt=Date.now(); save(); render(); };
window.startSeq = id => { const l=leadById(id);
  l.followUp={active:true,step:0,startedAt:Date.now(),lastSentAt:null};
  logTo(l,'note','Follow-up sequence started'); save(); render(); };
window.addNote = id => { const l=leadById(id); const v=$('#note-'+id).value.trim();
  if(!v) return; logTo(l,'note',v); save(); toast('Noted'); render(); };
window.saveQuote = id => { const l=leadById(id);
  const num=$('#q-num-'+id).value.trim(), tot=Number($('#q-tot-'+id).value)||0;
  if(!num){ toast('Needs a quote number'); return; }
  l.quote={number:num,total:tot,date:new Date().toISOString().slice(0,10),status:'sent'};
  logTo(l,'quote','Quote '+num+' recorded, '+money(tot));
  if(l.salesStage==='est_req'||l.salesStage==='call_done') setStage(l,'est_sent');
  save(); toast('Quote recorded'); render(); };
window.toggleAssign = id => { const l=leadById(id); l.assigned=!l.assigned;
  logTo(l,'note', l.assigned?'Site sent to Snoop':'Taken back from Snoop');
  if(l.assigned && l.salesStage==='visit_req') {}
  save(); render(); };
window.copyContract = id => {
  const l = leadById(id), q = quoteOf(l.package), p = PACKAGES[l.package];
  if(!q){ toast('No package set'); return; }
  const t = `${p.name} - ${l.name}\n`+
    `Solar equipment package   ${money2(q.base)}\n`+
    `VAT on parts              ${money2(q.vatParts)}\n`+
    `Estimated freight         ${money2(q.freight)}\n`+
    `VAT on landed costs       ${money2(q.vatLanded)}\n`+
    `Total Sales Order         ${money2(q.total)}\n\n`+
    `Deposit upon signature, 50%   ${money2(q.deposit)}\n`+
    `Balance on arrival, 50%       ${money2(q.balance)}`;
  navigator.clipboard ? navigator.clipboard.writeText(t).then(()=>toast('Contract figures copied'))
    : prompt('Copy this',t);
};
window.copyPacket = id => {
  const l=leadById(id), p=PACKAGES[l.package];
  const t = `QUOTE REQUEST\n`+
    `Name: ${l.name}\nPhone: +${l.phone}\nEmail: ${l.email||'not given'}\n`+
    `Address: ${l.address||'not given'}\nIsland: ${l.island}\n`+
    `Property: ${l.propertyType==='business'?'Business':'Home'}\n`+
    `Light bill: ${l.bill?money(l.bill)+' a month':'not given'}\n`+
    `System: ${p?p.name:'to be decided'}${p?' at '+money(p.price):''}\n`+
    (p?`Spec: ${p.panels}, ${p.inverter}, ${p.battery}\n`:'')+
    `Notes: ${l.objective||l.notes||'none'}`;
  navigator.clipboard ? navigator.clipboard.writeText(t).then(()=>toast('Packet copied'))
    : prompt('Copy this',t);
};

/* --- SITE NOTES --- */
/* What came back from whichever installer looked at the site. */
function surveyBlock(l){
  const s = l.survey || {};
  return `<div class="card pad">
    <label class="f"><span>Which installer looked at it</span>
      <input class="in" id="s-who" value="${esc(s.installer||'')}" placeholder="Snoop, or whoever the client used"></label>
    <div class="two">
      <label class="f"><span>Visit date</span><input class="in" type="date" id="s-date" value="${esc(s.visitDate||'')}"></label>
      <label class="f"><span>Roof type</span><select class="in" id="s-roof">
        ${['Shingle','Metal or tin','Flat cement','Ground mount needed','Other']
          .map(r=>`<option ${s.roofType===r?'selected':''}>${r}</option>`).join('')}</select></label>
    </div>
    <div class="two">
      <label class="f"><span>Usable area, sq ft</span><input class="in" type="number" id="s-area" value="${esc(s.usableArea||'')}"></label>
      <label class="f"><span>Panels that fit</span><input class="in" type="number" id="s-panels" value="${esc(s.panelsFit||'')}"></label>
    </div>
    <label class="f"><span>Where the batteries go</span>
      <input class="in" id="s-batt" value="${esc(s.batteryLoc||'')}" placeholder="Back store room, north wall"></label>
    <label class="f"><span>Wire run to the panel, feet</span>
      <input class="in" type="number" id="s-wire" value="${esc(s.wireRun||'')}"></label>
    <hr class="sep">
    <label class="f"><span>Roof structure or build out needed</span>
      <select class="in" id="s-roofb"><option value="no" ${!s.roofBuildout?'selected':''}>No</option>
      <option value="yes" ${s.roofBuildout?'selected':''}>Yes</option></select></label>
    <label class="f"><span>Notes on that</span><textarea class="in" id="s-roofn">${esc(s.roofNotes||'')}</textarea></label>
    <label class="f"><span>Battery enclosure or room needed</span>
      <select class="in" id="s-enc"><option value="no" ${!s.enclosure?'selected':''}>No</option>
      <option value="yes" ${s.enclosure?'selected':''}>Yes</option></select></label>
    <label class="f"><span>Notes on that</span><textarea class="in" id="s-encn">${esc(s.enclosureNotes||'')}</textarea></label>
    <hr class="sep">
    <label class="f"><span>Their install quote</span>
      <input class="in" type="number" id="s-quote" value="${esc(s.installQuote||'')}" placeholder="Dollars, paid direct to them"></label>
    <label class="f"><span>Does the system size work</span>
      <select class="in" id="s-verdict">
        <option value="confirmed" ${s.verdict==='confirmed'?'selected':''}>Yes, it works as specified</option>
        <option value="flagged" ${s.verdict==='flagged'?'selected':''}>No, there is a problem</option>
      </select></label>
    <label class="f"><span>What they would do instead</span>
      <textarea class="in" id="s-rec">${esc(s.recommend||'')}</textarea></label>
    <label class="f"><span>Anything else worth recording</span>
      <textarea class="in" id="s-com">${esc(s.comments||'')}</textarea></label>
    <button class="btn" onclick="saveSurvey('${l.id}')">Save site findings</button>
  </div>`;
}
window.saveSurvey = id => {
  const l = leadById(id);
  l.survey = {
    visitDate:$('#s-date').value, roofType:$('#s-roof').value,
    usableArea:$('#s-area').value, panelsFit:$('#s-panels').value,
    batteryLoc:$('#s-batt').value, wireRun:$('#s-wire').value,
    roofBuildout:$('#s-roofb').value==='yes', roofNotes:$('#s-roofn').value,
    enclosure:$('#s-enc').value==='yes', enclosureNotes:$('#s-encn').value,
    installQuote:$('#s-quote').value, verdict:$('#s-verdict').value,
    recommend:$('#s-rec').value, comments:$('#s-com').value,
    installer:$('#s-who').value,
    by:ROLES[S.role].label, at:Date.now()
  };
  logTo(l,'survey','Site findings recorded from '+(l.survey.installer||'the installer')+
    '. System size '+(l.survey.verdict==='flagged'?'FLAGGED':'confirmed')+'.');
  save(); toast('Site findings saved'); render();
};
function surveyReadout(l){
  const s = l.survey;
  return `<div class="card pad" style="border-color:${s.verdict==='flagged'?'var(--alert)':'var(--ok)'}">
    <div class="row" style="margin-bottom:8px">
      <strong class="grow">Snoop's survey, ${fmtDate(s.at)}</strong>
      <span class="tag ${s.verdict==='flagged'?'alert':'ok'}">
        ${s.verdict==='flagged'?'Size flagged':'Size confirmed'}</span></div>
    <div class="kv"><span class="k">Roof</span><span class="v">${esc(s.roofType)}</span></div>
    <div class="kv"><span class="k">Usable area</span><span class="v">${esc(s.usableArea)} sq ft</span></div>
    <div class="kv"><span class="k">Panels that fit</span><span class="v">${esc(s.panelsFit)}</span></div>
    <div class="kv"><span class="k">Batteries</span><span class="v">${esc(s.batteryLoc)}</span></div>
    <div class="kv"><span class="k">Wire run</span><span class="v">${esc(s.wireRun)} ft</span></div>
    <div class="kv"><span class="k">Roof build out</span><span class="v">${s.roofBuildout?'Yes':'No'}</span></div>
    <div class="kv"><span class="k">Battery enclosure</span><span class="v">${s.enclosure?'Yes':'No'}</span></div>
    <div class="kv"><span class="k">His install quote</span><span class="v">${money(s.installQuote)}</span></div>
    ${s.recommend?`<p class="tiny" style="margin:10px 0 0"><strong>He suggests:</strong> ${esc(s.recommend)}</p>`:''}
    ${s.comments?`<p class="tiny" style="margin:6px 0 0;color:var(--ink2)">${esc(s.comments)}</p>`:''}
    ${s.roofNotes?`<p class="tiny mut" style="margin:6px 0 0">Roof: ${esc(s.roofNotes)}</p>`:''}
    ${s.enclosureNotes?`<p class="tiny mut" style="margin:4px 0 0">Enclosure: ${esc(s.enclosureNotes)}</p>`:''}
  </div>`;
}

/* ---------- SPEC SHEET -----------------------------------------------------
   One page, branded, printable to PDF. Everything an installer needs to quote
   the job without seeing the pipeline. Works on a phone: Share, then Print,
   then Save to Files.                                                        */
window.openSpec = id => { S.spec = id; S.open = null; S.tab = 'spec'; window.scrollTo(0,0); render(); };

function viewSpecSheet(){
  const l = leadById(S.spec);
  if(!l) return `<div class="wrap"><div class="empty"><h3>Nothing selected</h3></div></div>`;
  const p = PACKAGES[l.package], sp = p ? spaceFor(p.code) : null;
  const H = HARDWARE;
  const ref = 'IPB-SPEC-' + l.id.slice(1,6).toUpperCase();
  const dt = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const pr = n => n==null?'-':n;

  return `<div class="printbar">
      <button class="btn dim" onclick="go('leads')">Back</button>
      <button class="btn" onclick="window.print()">Save as PDF</button>
      <span class="tiny" style="color:#fff;opacity:.75">Phone: Share, then Print, then Save to Files</span>
    </div>
  <div class="doc">
    <div class="goldbar"></div>
    <div class="dhead">
      <div class="brand">
        <div class="nm">INDEPENDENT<br><b>POWER</b></div>
        <div class="sub">B A H A M A S</div>
        <div class="tagline">SOLAR &nbsp;&bull;&nbsp; ELECTRICAL &nbsp;&bull;&nbsp; ENERGY STORAGE</div>
      </div>
      <div class="dref">
        <h3>Installation Spec Sheet</h3>
        <div class="r">${ref}</div>
        <div class="d">${dt}</div>
        <div class="d">${p?p.name:'System to be confirmed'}</div>
      </div>
    </div>

    <div class="band">CLIENT AND SITE</div>
    <div class="dbody">
      <div class="pair"><div class="pk">Client</div><div class="pv">${esc(l.name)}</div></div>
      <div class="pair"><div class="pk">Contact</div><div class="pv">${l.phone?'+'+esc(l.phone):'To be confirmed'}${l.email?' &nbsp;&bull;&nbsp; '+esc(l.email):''}</div></div>
      <div class="pair"><div class="pk">Site address</div><div class="pv">${esc(l.address||'To be confirmed')}</div></div>
      <div class="pair"><div class="pk">Island</div><div class="pv">${esc(l.island)}</div></div>
      <div class="pair"><div class="pk">Property</div><div class="pv">${l.propertyType==='business'?'Business':'Residential'}</div></div>
      <div class="pair"><div class="pk">Mounting</div><div class="pv">${l.survey&&l.survey.roofType?esc(l.survey.roofType):'Roof mount unless site says otherwise'}</div></div>
    </div>

    <div class="band">EQUIPMENT SUPPLIED BY INDEPENDENT POWER BAHAMAS</div>
    <div class="dbody">
      ${p?`<table>
        <tr><th>Item</th><th>Specification</th><th style="text-align:right">Qty</th></tr>
        <tr><td>Solar panels</td><td>${H.panel.name}, ${H.panel.w} x ${H.panel.h} x ${H.panel.d} in, ${H.panel.lb} lb each</td><td class="n">${p.panelQty}</td></tr>
        <tr><td>Inverter</td><td>${esc(sp.invName)}, ${esc(sp.invEach)}</td><td class="n">${p.invQty}</td></tr>
        <tr><td>Battery</td><td>${H.battery.name}, ${H.battery.w} x ${H.battery.d} x ${H.battery.h} in, ${H.battery.lb} lb each</td><td class="n">${p.batteryQty}</td></tr>
        <tr><td>Mounting</td><td>${esc(p.mount)}</td><td class="n">1 set</td></tr>
        <tr><td>PV cable</td><td>4mm&sup2; PV cable, ${esc(p.wire)}</td><td class="n">1</td></tr>
        <tr><td>Combiner box</td><td>${esc(p.combiner)}, DC 500V</td><td class="n">${p.invQty}</td></tr>
      </table>
      <div class="callout"><strong>System output.</strong> ${p.kwh.toLocaleString()} kWh a month.
        Battery storage ${(p.batteryQty*16.08).toFixed(1)} kWh. Split phase 120/240V.
        The inverter draws from the grid automatically when solar and battery run low.</div>`
      :'<p>System not yet matched. Confirm with Independent Power Bahamas before quoting.</p>'}
    </div>

    ${sp?`<div class="band">SPACE AND STRUCTURAL REQUIREMENTS</div>
    <div class="dbody">
      <div class="pair"><div class="pk">Panel array area</div><div class="pv">${sp.arraySqft} sq ft of clear, unshaded roof or ground</div></div>
      <div class="pair"><div class="pk">Battery bank</div><div class="pv">${sp.bankW} x ${sp.bankD} x ${sp.bankH} in &nbsp;(${sp.batteryQty} unit${sp.batteryQty>1?'s':''}${sp.stacks>1?' in '+sp.stacks+' stacks':''})</div></div>
      <div class="pair"><div class="pk">Battery floor space</div><div class="pv">${sp.bankFloorSqft} sq ft including 30 in service access</div></div>
      <div class="pair"><div class="pk">Inverter wall space</div><div class="pv">${sp.wallW} x ${sp.wallH} in clear, 12 in all round for airflow</div></div>
      <div class="pair"><div class="pk">Total equipment area</div><div class="pv">${sp.roomSqft} sq ft</div></div>
      <div class="pair"><div class="pk">Equipment weight</div><div class="pv">${sp.weight.toLocaleString()} lb total, panels ${H.panel.lb} lb each, batteries ${H.battery.lb} lb each</div></div>
      <div class="callout"><strong>Structure.</strong> Batteries stack a maximum of three high and
        must sit on a level, dry, ventilated surface rated for the weight above. Confirm the roof
        structure carries the array before mounting. Batteries are IP21 and are not rated for
        exposed outdoor mounting.</div>
    </div>`:''}

    <div class="band">SCOPE OF WORK TO BE QUOTED</div>
    <div class="dbody">
      <div class="pair"><div class="pk">1</div><div class="pv">Collect equipment from the drop point and deliver to site. Equipment is heavy, a truck with a fork lift is recommended.</div></div>
      <div class="pair"><div class="pk">2</div><div class="pv">Install the mounting system and set the panel array.</div></div>
      <div class="pair"><div class="pk">3</div><div class="pv">Mount and connect the inverter and battery bank.</div></div>
      <div class="pair"><div class="pk">4</div><div class="pv">Run PV cable, combiner box, grounding, conduit and load wire to the house panel.</div></div>
      <div class="pair"><div class="pk">5</div><div class="pv">Fit disconnect sub panels for grid in and house out.</div></div>
      <div class="pair"><div class="pk">6</div><div class="pv">Commission the system, test and hand over to the client.</div></div>
      <div class="pair"><div class="pk">Price separately</div><div class="pv">Any roof structure build out, ground mount array, battery enclosure or room, trenching, and electrical materials not listed above.</div></div>
      ${l.objective?`<div class="callout"><strong>Client notes.</strong> ${esc(l.objective)}</div>`:''}
      ${l.survey&&l.survey.comments?`<div class="callout"><strong>From the site visit.</strong> ${esc(l.survey.comments)}${l.survey.recommend?' '+esc(l.survey.recommend):''}</div>`:''}
    </div>

    <div class="band">INSTALLER QUOTE</div>
    <div class="dbody">
      <p style="margin:0 0 2px;font-size:12px">To be completed by the installing contractor. Installation
      is contracted and paid directly between the client and the installer. Independent Power Bahamas
      supplies the equipment only.</p>
      <div class="sign">
        <div class="line"><span>INSTALLER / COMPANY</span></div>
        <div class="line"><span>LABOUR AND MATERIALS QUOTED</span></div>
        <div class="line"><span>ADDITIONAL BUILD OUT, IF ANY</span></div>
        <div class="line"><span>ESTIMATED START DATE AND DURATION</span></div>
        <div class="line"><span>SIGNATURE AND DATE</span></div>
      </div>
      <p class="fine">Figures in this document describe the equipment supplied and the space it
      requires. They are not a quotation for installation. Site conditions, structure, roof
      condition, access and existing electrical systems must be verified on site before pricing.
      Hidden damage, defective wiring, corrosion, structural deficiencies and other concealed
      conditions may require a revised price. Any energy production, savings or battery runtime
      figures are estimates based on stated assumptions and are not guaranteed.</p>
    </div>

    <div class="dfoot">
      <span>Independent Power Bahamas &nbsp;&bull;&nbsp; powerbahamas.com</span>
      <span>${ref}</span>
    </div>
  </div>`;
}

/* ---------- 8. RENDER ----------------------------------------------------- */
function render(){
  const app = $('#app');
  if(!S.role){ app.innerHTML = viewGate(); return; }
  let body = '';
  if(S.open==='new') body = viewNewLead();
  else if(S.open){ const l = leadById(S.open); body = l ? viewLead(l) : ''; if(!l) S.open=null; }
  else {
    const v = {today:viewToday, pipeline:viewPipeline, leads:viewLeads, money:viewMoney,
      more:viewMore, broadcast:viewBroadcast, spec:viewSpecSheet}[S.tab] || viewToday;
    body = v();
  }
  app.innerHTML = viewTop() + body + viewNav() +
    (S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}

/* ---------- 9. BOOT ------------------------------------------------------- */
(async function boot(){
  const loaded = await Store.load();
  S.data = loaded && loaded.leads ? loaded : seed();
  if(!S.data.settings) S.data.settings = {shipmentMonth:'',lastBroadcast:null};
  try{ const r = sessionStorage.getItem('ipb_role'); if(r && ROLES[r]) { S.role=r; S.tab='today'; } }catch(e){}
  if(!loaded) save();
  render();
})();
</script>
</body>
</html>
